# FlowDisplacementNet (M5) — FlowNet3D-style displacement baseline.
model: flow_displacement
data_root: data/DMSurface
num_points: 2048
batch_size: 24
lr: 0.001
epochs: 500
lr_decay_step: 80
lr_decay_rate: 0.7
weight_decay: 0.0001
# Model parameters
feature_dim: 256
# System / reproducibility
seed: 42
gpu: 0
num_workers: 4
log_dir: log/flow_displacement
